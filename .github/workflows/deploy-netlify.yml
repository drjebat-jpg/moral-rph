name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Set GEMINI_API_KEY in Netlify env
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Get real site ID from name
          REAL_SITE_ID=$(curl -s \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?filter=all&per_page=100" | \
            python3 -c "
          import sys, json
          sites = json.load(sys.stdin)
          target = '$NETLIFY_SITE_ID'
          for s in sites:
              if target in [s.get('name',''), s.get('subdomain',''), s.get('id','')]:
                  print(s['id'])
                  break
          " 2>/dev/null)

          if [ -n "$REAL_SITE_ID" ]; then
            echo "REAL_SITE_ID=$REAL_SITE_ID" >> $GITHUB_ENV
            # Set GEMINI_API_KEY env var in Netlify
            curl -s -X PATCH \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.netlify.com/api/v1/sites/$REAL_SITE_ID" \
              -d "{\"build_settings\":{\"env\":{\"GEMINI_API_KEY\":\"${{ secrets.GEMINI_API_KEY }}\"}}}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('Site updated:', r.get('id','?')[:8])" 2>/dev/null || true
          fi

      - name: Deploy to Netlify (build + functions)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          SITE_ID="${REAL_SITE_ID:-${{ secrets.NETLIFY_SITE_ID }}}"
          netlify deploy \
            --dir=./dist \
            --functions=./netlify/functions \
            --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$SITE_ID"
